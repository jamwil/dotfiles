save-position-on-quit=yes
volume-max=100
volume=100
autofit-larger=70%x70%
profile=high-quality
vo=gpu
ytdl-format="bv+ba/b"
ontop=no

[iptv]
profile-desc = "IPTV stream settings"
profile-cond = string.find(path, "https?://") ~= nil
profile-restore = copy

# Activate the iptv script
script-opts-append = iptv=1

# Reconnect settings
stream-lavf-o-append = reconnect=1
stream-lavf-o-append = reconnect_streamed=yes
stream-lavf-o-append = reconnect_on_network_error=yes
stream-lavf-o-append = reconnect_on_http_error=4xx,5xx
stream-lavf-o-append = reconnect_delay_max=30
stream-lavf-o-append = reconnect_at_eof=1

